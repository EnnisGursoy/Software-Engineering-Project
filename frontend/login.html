<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login • Payroll System</title>

<style>

:root{
--bg:#f6f9fc;
--card:#ffffff;
--border:#d1d5db;
--primary:#1d4ed8;
--primary-dark:#1e40af;
--text:#1f2937;
--muted:#6b7280;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Segoe UI, Tahoma, Geneva, Verdana, sans-serif;
background:var(--bg);
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.login-container{
background:var(--card);
border:1px solid var(--border);
border-radius:12px;
padding:40px;
width:380px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

h1{
margin:0 0 10px 0;
text-align:center;
font-size:1.6rem;
color:var(--text);
}

.subtitle{
text-align:center;
color:var(--muted);
margin-bottom:25px;
font-size:.9rem;
}

form{
display:flex;
flex-direction:column;
gap:15px;
}

label{
font-size:.9rem;
font-weight:600;
}

input{
padding:12px;
border-radius:8px;
border:1px solid var(--border);
font-size:.95rem;
}

input:focus{
outline:none;
border-color:var(--primary);
}

button{
margin-top:10px;
padding:12px;
border:none;
border-radius:8px;
background:var(--primary);
color:white;
font-weight:600;
cursor:pointer;
font-size:1rem;
}

button:hover{
background:var(--primary-dark);
}

.footer{
margin-top:20px;
text-align:center;
font-size:.8rem;
color:var(--muted);
}

</style>
</head>

<body>

<div class="login-container">

<h1>Payroll System</h1>
<div class="subtitle">Sign in to your account</div>

<form action="/login" method="POST">

<label for="username">Username</label>
<input type="text" id="username" name="username" required>

<label for="password">Password</label>
<input type="password" id="password" name="password" required>

<button type="submit">Login</button>

</form>

<div class="footer">
Secure Payroll Management
</div>

</div>

</body>
</html>
