<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login - Payroll System</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body style="margin:0; height:100vh;">
	<div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; transform:scale(1.5);">
		<header style="width:100%; text-align:center;">
			<h1>Payroll System Login</h1>
		</header>
		<main style="width:100%; display:flex; flex-direction:column; align-items:center;">
			<form action="/login" method="post" style="display:flex; flex-direction:column; align-items:center; gap:10px; min-width:220px;">
				<label for="username">Username:</label>
				<input type="text" id="username" name="username" required>
				<label for="password">Password:</label>
				<input type="password" id="password" name="password" required>
				<button type="submit">Login</button>
			</form>
		</main>
	</div>
</body>
</html>
