<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payroll v1</title>
  <style>
    :root {
      --bg: #eef3f9;
      --text: #1f2937;
      --surface: #ffffff;
      --border: #d4dde8;
      --accent: #0f766e;
      --primary: #1d4ed8;
      --primary-dark: #1e40af;
      --muted: #64748b;
      --table-bg: #ffffff;
      --table-border: #dbe5f0;
      --table-text: #1f2937;
      --table-muted: #374151;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top left, #dbeafe 0%, transparent 35%),
        radial-gradient(circle at top right, #e0f2fe 0%, transparent 30%),
        var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--primary);
      border-bottom: 1px solid var(--primary-dark);
      position: relative;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      color: #ffffff;
    }

    .menu-wrap { position: relative; }

    .menu-btn {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 0;
    }

    .menu-btn span {
      width: 20px;
      height: 2px;
      background: #ffffff;
      border-radius: 10px;
      display: block;
    }

    .menu {
      position: absolute;
      right: 0;
      top: 50px;
      min-width: 210px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 8px;
      display: none;
      z-index: 20;
    }

    .menu.open { display: block; }

    .menu a {
      display: block;
      text-decoration: none;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .menu a:hover {
      background: #ecfeff;
      color: var(--accent);
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.05fr auto 1fr auto 1.25fr;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 3px solid #0f172a;
      padding: 14px 18px;
      margin-bottom: 16px;
    }

    .divider {
      color: #475569;
      font-size: 1.35rem;
      line-height: 1;
      user-select: none;
    }

    .control {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #1f2937;
      font-size: 1rem;
      font-family: inherit;
      padding: 4px 0;
    }

    .control::placeholder { color: var(--muted); }

    .select-wrap {
      position: relative;
      width: 100%;
    }

    select.control {
      appearance: none;
      cursor: pointer;
      padding-right: 18px;
    }

    .select-wrap::after {
      content: "";
      position: absolute;
      right: 2px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid #475569;
      border-bottom: 2px solid #475569;
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }

    .table-shell {
      background: var(--surface);
      border: 1px solid var(--table-border);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.06);
    }

    .table-card {
      background: var(--table-bg);
      border: 1px solid var(--table-border);
      border-radius: 10px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      color: var(--table-text);
    }

    thead th {
      font-size: 1.05rem;
      font-weight: 600;
      text-align: left;
      color: #334155;
      background: #f8fbff;
      border-bottom: 1px solid var(--table-border);
      padding: 14px 16px 11px;
      vertical-align: top;
    }

    tbody td {
      padding: 12px 16px;
      color: var(--table-muted);
      vertical-align: top;
      font-size: 0.98rem;
    }

    .name {
      font-weight: 700;
      color: #0f172a;
      line-height: 1.25;
      font-size: 1rem;
    }

    .amount {
      font-weight: 700;
      color: #0f172a;
      font-size: 1rem;
    }

    tbody tr + tr td {
      border-top: 1px solid var(--table-border);
    }

    tbody tr:nth-child(even) td {
      background: #fcfdff;
    }

    .small {
      font-size: 0.92rem;
      color: #9ca3af;
      display: block;
      margin-top: 4px;
    }

    @media (max-width: 980px) {
      .filters {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .divider { display: none; }

      .filters .control,
      .filters .select-wrap {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        background: #f8fafc;
      }

      select.control {
        padding-right: 28px;
      }

      .select-wrap::after {
        right: 11px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Payroll</h1>

    <div class="menu-wrap">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="hrMenu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="menu" id="hrMenu" aria-hidden="true">
        <a href="template_main_page.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="employees.html">Employees</a>
        <a href="shifts.html">Shifts</a>
        <a href="payroll.html">Payroll</a>
        <a href="taxes.html">Taxes</a>
        <a href="reports.html">Reports</a>
        <a href="settings.html">Settings</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="filters" aria-label="Payroll filters">
      <input class="control" type="search" placeholder="Search" aria-label="Search employee">
      <span class="divider" aria-hidden="true">|</span>
      <div class="select-wrap">
        <select class="control" aria-label="Fiscal year and quarter">
          <option>Fiscal Year/Quarter</option>
          <option>2026 Q1</option>
          <option>2025 Q4</option>
          <option>2025 Q3</option>
        </select>
      </div>
      <span class="divider" aria-hidden="true">|</span>
      <div class="select-wrap">
        <select class="control" aria-label="Payment status">
          <option>Drop down of (Paid, Pending, Overdue)</option>
          <option>Paid</option>
          <option>Pending</option>
          <option>Overdue</option>
        </select>
      </div>
    </section>

    <section class="table-shell" aria-label="Payroll table container">
      <div class="table-card">
        <table aria-label="Payroll records">
          <thead>
            <tr>
              <th>Employee (ID)</th>
              <th>Tax<br>Period</th>
              <th>Gross<br>Pay</th>
              <th>Fed<br>Withholding</th>
              <th>State<br>Tax</th>
              <th>Employer<br>FICA</th>
              <th>Total<br>Tax</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>
                <span class="name">User 1</span>
                <span class="small">(#104)</span>
              </td>
              <td>2026 Q1</td>
              <td class="amount">$0</td>
              <td>$0</td>
              <td>$0</td>
              <td>$0</td>
              <td class="amount">$0</td>
            </tr>
            <tr>
              <td>
                <span class="name">User 2</span>
                <span class="small">(#102)</span>
              </td>
              <td>2026 Q1</td>
              <td class="amount">$0</td>
              <td>$0</td>
              <td>$0</td>
              <td>$0</td>
              <td class="amount">$0</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const hrMenu = document.getElementById('hrMenu');

    menuBtn.addEventListener('click', () => {
      const isOpen = hrMenu.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', String(isOpen));
      hrMenu.setAttribute('aria-hidden', String(!isOpen));
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.menu-wrap')) {
        hrMenu.classList.remove('open');
        menuBtn.setAttribute('aria-expanded', 'false');
        hrMenu.setAttribute('aria-hidden', 'true');
      }
    });
  </script>
</body>
</html>
