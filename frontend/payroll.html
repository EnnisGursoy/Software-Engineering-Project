<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payroll</title>
  <style>
    :root {
      --bg: #f6f9fc;
      --text: #1f2937;
      --surface: #ffffff;
      --border: #d1d5db;
      --accent: #0f766e;
      --primary: #1d4ed8;
      --primary-dark: #1e40af;
      --muted: #64748b;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    body.dark {
      --bg: #0b1220;
      --surface: #111827;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --accent: #14b8a6;
      --table-bg: #111827;
      --table-border: #374151;
      --table-text: #f3f4f6;
      --table-muted: #d1d5db;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top left, #dbeafe 0%, transparent 35%),
                  radial-gradient(circle at top right, #e0f2fe 0%, transparent 30%),
                  var(--bg);
      color: var(--text);
      transition: background 0.2s, color 0.2s;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #1d4ed8;
      border-bottom: 1px solid #1e40af;
      position: relative;
    }

    h1 { margin: 0; font-size: 1.3rem; color: #ffffff; }

    main {
      padding: 24px 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 780px;
    }

    .menu-wrap {
      position: relative;
    }

    .menu-btn {
      width: 42px; height: 42px;
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 8px;
      background: rgba(255,255,255,0.12);
      cursor: pointer;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      gap: 5px; padding: 0;
    }

    .menu-btn span { width: 20px; height: 2px; background: #fff; border-radius: 10px; display: block; }

    .menu {
      position: absolute; right: 0; top: 50px;
      min-width: 210px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 8px; display: none; z-index: 20;
    }

    .menu.open {
      display: block;
    }

    .menu a {
      display: block; text-decoration: none; color: var(--text);
      padding: 10px 12px; border-radius: 8px; font-size: 0.95rem;
    }

    .menu a:hover { background: #ecfeff; color: var(--accent); }

    main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 40px; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .toolbar-left { display: flex; gap: 10px; flex: 1; flex-wrap: wrap; align-items: center; }

    .btn {
      padding: 9px 16px;
      border: none; border-radius: 8px;
      font-size: 0.9rem; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }

    .btn-primary   { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-green     { background: #15803d; color: #fff; }
    .btn-green:hover { background: #166534; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn:disabled  { opacity: 0.5; cursor: not-allowed; }

    /* ── Filters ── */
    .filters {
      display: grid;
      grid-template-columns: 1.2fr auto 1.2fr auto 1fr;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 14px 18px;
      margin-bottom: 16px;
    }

    .divider { color: #475569; font-size: 1.35rem; line-height: 1; user-select: none; }

    .control {
      width: 100%; border: 0; outline: 0;
      background: transparent; color: var(--text);
      font-size: 1rem; font-family: inherit; padding: 4px 0;
    }

    .control::placeholder { color: var(--muted); }

    .select-wrap { position: relative; width: 100%; }

    select.control { appearance: none; cursor: pointer; padding-right: 18px; }

    .select-wrap::after {
      content: ""; position: absolute; right: 2px; top: 50%;
      width: 8px; height: 8px;
      border-right: 2px solid #475569; border-bottom: 2px solid #475569;
      transform: translateY(-70%) rotate(45deg); pointer-events: none;
    }

    /* ── Table ── */
    .table-shell {
      background: var(--surface);
      border: 1px solid var(--table-border);
      border-radius: 12px; padding: 12px;
      box-shadow: 0 10px 20px rgba(15,23,42,0.06);
    }

    .table-card {
      background: var(--table-bg);
      border: 1px solid var(--table-border);
      border-radius: 10px; overflow-x: auto;
    }

    table { width: 100%; min-width: 860px; border-collapse: collapse; color: var(--table-text); }

    thead th {
      font-size: 0.95rem; font-weight: 600; text-align: left;
      color: #334155; background: #f8fbff;
      border-bottom: 1px solid var(--table-border);
      padding: 13px 16px 10px;
    }

    tbody td { padding: 12px 16px; color: var(--table-muted); font-size: 0.97rem; }

    .name  { font-weight: 700; color: var(--text); line-height: 1.25; }
    .amount { font-weight: 700; color: var(--text); }
    .small { font-size: 0.85rem; color: #9ca3af; display: block; margin-top: 3px; }
    tbody tr + tr td { border-top: 1px solid var(--table-border); }
    tbody tr:nth-child(even) td { background: #fcfdff; }

    /* ── Status badge ── */
    .badge {
      display: inline-block; font-size: 0.78rem; font-weight: 600;
      padding: 2px 8px; border-radius: 99px;
    }
    .badge-processed { background: #d1fae5; color: #065f46; }
    .badge-pending   { background: #fef3c7; color: #92400e; }
    .badge-paid      { background: #dbeafe; color: #1e40af; }
    .badge-void      { background: #fee2e2; color: #991b1b; }

    /* ── Modal ── */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 100;
      align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }

    .modal {
      background: var(--surface); border-radius: 14px;
      padding: 28px 30px; width: 100%; max-width: 440px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    .modal h3 { margin: 0 0 18px; font-size: 1.1rem; color: var(--text); }

    .form-group { margin-bottom: 14px; }

    .form-group label {
      display: block; font-size: 0.8rem; font-weight: 600;
      color: var(--muted); margin-bottom: 4px;
      text-transform: uppercase; letter-spacing: 0.3px;
    }

    .form-group input,
    .form-group select {
      width: 100%; padding: 9px 11px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 0.93rem; font-family: inherit;
      color: var(--text); background: var(--surface); outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(29,78,216,0.12);
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

    .status-bar {
      padding: 10px 14px; border-radius: 8px;
      font-size: 0.88rem; font-weight: 500; margin-bottom: 14px; display: none;
    }
    .status-bar.success { background: #d1fae5; color: #065f46; display: block; }
    .status-bar.error   { background: #fee2e2; color: #991b1b; display: block; }
    .status-bar.info    { background: #dbeafe; color: #1e40af; display: block; }

    @media (max-width: 900px) {
      .filters { grid-template-columns: 1fr; gap: 8px; }
      .divider { display: none; }
    }
  </style>
  <link rel="stylesheet" href="app-theme.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
  <div class="topbar-left">
    <a href="homepage.html" class="brand">
      <div class="brand-logo">
        <img src="PAY CENTRAL LOGO.png" alt="PayCentral logo">
      </div>
      <div class="brand-text">
        <h1>PayCentral</h1>
        <p>Payroll</p>
      </div>
    </a>
  </div>
  <div class="topbar-actions">
    <button class="top-btn" id="themeToggle" type="button">Toggle Theme</button>
      <div class="menu-wrap">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="hrMenu">
          <span></span><span></span><span></span>
        </button>
        <nav class="menu" id="hrMenu" aria-hidden="true">
          <a href="homepage.html">Home</a>
          <a href="profile.html">Profile</a>
          <a href="employees.html">Employees</a>
          <a href="departments.html">Departments</a>
          <a href="shifts.html">Shifts</a>
          <a href="payroll.html">Payroll</a>
          <a href="benefits.html">Benefits</a>
          <a href="taxes.html">Taxes</a>
          <a href="reports.html">Reports</a>
          <a href="audit.html">Audit Log</a>
          <a href="settings.html">Settings</a>
          <a href="logout.html" class="signout">Sign Out</a>
        </nav>
      </div>  </div>
</header>

  <main>
    <div id="statusBar" class="status-bar"></div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn btn-primary" onclick="openModal('periodModal')">+ New Pay Period</button>
        <select id="periodSelect" style="padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:0.9rem;font-family:inherit;background:var(--surface);color:var(--text);min-width:220px;">
          <option value="">Select pay period to run…</option>
        </select>
        <button class="btn" onclick="previewPayroll()" style="border:1px solid var(--border);background:var(--surface);color:var(--text);">&#x1F441; Preview</button>
        <button class="btn btn-green" id="runBtn" onclick="runPayroll()">▶ Run Payroll</button>
      </div>
    </div>

    <!-- Filters -->
    <section class="filters" aria-label="Payroll filters">
      <input class="control" id="searchInput" type="search" placeholder="Search by employee ID" aria-label="Search employee">
      <span class="divider" aria-hidden="true">|</span>
      <div class="select-wrap">
        <select class="control" id="periodFilter" aria-label="Filter by pay period">
          <option value="">All Pay Periods</option>
        </select>
      </div>
      <span class="divider" aria-hidden="true">|</span>
      <div class="select-wrap">
        <select class="control" id="statusFilter" aria-label="Payment status">
          <option value="">All Statuses</option>
          <option value="paid">Paid</option>
          <option value="pending">Pending</option>
          <option value="processed">Processed</option>
          <option value="void">Void</option>
        </select>
      </div>
    </section>

    <!-- Table -->
    <section class="table-shell">
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>Employee</th>
              <th>Pay Period</th>
              <th>Gross Pay</th>
              <th>Fed Tax</th>
              <th>State Tax</th>
              <th>FICA</th>
              <th>Net Pay</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="payrollBody">
            <tr><td colspan="8" style="text-align:center;padding:24px;color:#64748b;">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- New Pay Period Modal -->
  <div class="modal-backdrop" id="periodModal">
    <div class="modal">
      <h3>New Pay Period</h3>
      <form id="periodForm" onsubmit="submitPeriod(event)">
        <div class="form-group">
          <label>Period Type</label>
          <select id="pp_type" required>
            <option value="weekly">Weekly</option>
            <option value="bi_weekly" selected>Bi-Weekly</option>
            <option value="semi_monthly">Semi-Monthly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>
        <div class="form-group">
          <label>Start Date</label>
          <input type="date" id="pp_start" required>
        </div>
        <div class="form-group">
          <label>End Date</label>
          <input type="date" id="pp_end" required>
        </div>
        <div class="form-group">
          <label>Pay Date</label>
          <input type="date" id="pp_pay" required>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('periodModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // ── Menu ──────────────────────────────────────────────────────
    const menuBtn = document.getElementById('menuBtn');
    const hrMenu  = document.getElementById('hrMenu');

    menuBtn.addEventListener('click', () => {
      const isOpen = hrMenu.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', String(isOpen));
      hrMenu.setAttribute('aria-hidden', String(!isOpen));
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('.menu-wrap')) {
        hrMenu.classList.remove('open');
        menuBtn.setAttribute('aria-expanded', 'false');
        hrMenu.setAttribute('aria-hidden', 'true');
      }
    });

    // ── Dark mode ─────────────────────────────────────────────────
    if (localStorage.getItem('payroll_dark_mode') === 'enabled') {
      document.body.classList.add('dark');
    }
    document.getElementById('themeToggle').addEventListener('click', () => {
      document.body.classList.toggle('dark');
      localStorage.setItem('payroll_dark_mode', document.body.classList.contains('dark') ? 'enabled' : 'disabled');
    });

    // ── Config ────────────────────────────────────────────────────
    requireAuth({ roles: ['admin', 'hr', 'manager'] });
    const token = getToken();
    const role  = localStorage.getItem('user_role');
    const hdrs  = authHeaders({ 'Content-Type': 'application/json' });

    const fmt = n => n != null ? '$' + Number(n).toFixed(2) : '—';

    let allPaychecks = [];
    let allEmployees = [];
    let periodLabels = {};   // id → "start – end"

    // ── Status bar ────────────────────────────────────────────────
    function showStatus(msg, type = 'info') {
      const bar = document.getElementById('statusBar');
      bar.textContent = msg;
      bar.className = `status-bar ${type}`;
      if (type !== 'error') setTimeout(() => bar.className = 'status-bar', 4000);
    }

    // ── Modal helpers ─────────────────────────────────────────────
    function openModal(id)  { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      const openModal = document.querySelector('.modal-backdrop.open');
      if (openModal) openModal.classList.remove('open');
    });

    // ── Load employees → build name map ──────────────────────────
    async function loadEmployees() {
      try {
        const res = await fetch(`${API}/employee/all`, { headers: hdrs });
        if (res.ok) allEmployees = await res.json();
      } catch (_) {}
    }

    function empName(id) {
      const e = allEmployees.find(e => Number(e.employee_id) === Number(id));
      return e ? `${e.first_name} ${e.last_name}` : `Employee #${id}`;
    }

    // ── Load pay periods → populate selects ───────────────────────
    async function loadPeriods() {
      try {
        const res = await fetch(`${API}/payperiods/all`, { headers: hdrs });
        if (!res.ok) return;
        const periods = await res.json();

        const runSel    = document.getElementById('periodSelect');
        const filterSel = document.getElementById('periodFilter');

        // keep only open/processing in the run dropdown
        periods.forEach(p => {
          periodLabels[p.pay_period_id] = `${p.period_start_date} – ${p.period_end_date}`;

          const label = `${p.period_start_date} – ${p.period_end_date} (${p.status})`;

          if (p.status === 'open' || p.status === 'processing') {
            const opt = new Option(label, p.pay_period_id);
            runSel.appendChild(opt);
          }

          const fopt = new Option(label, p.pay_period_id);
          filterSel.appendChild(fopt);
        });
      } catch (_) {}
    }

    // ── Load paychecks ────────────────────────────────────────────
    async function loadPayroll() {
      const tbody     = document.getElementById('payrollBody');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const statusVal = document.getElementById('statusFilter').value;
      const periodVal = document.getElementById('periodFilter').value;

      try {
        const res = await fetch(`${API}/payroll/all`, { headers: hdrs });

        if (res.status === 401) {
          tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:24px;color:#ef4444;">Session expired — please log in again.</td></tr>`;
          return;
        }

        allPaychecks = await res.json();

        const rows = allPaychecks.filter(p => {
          const matchSearch = String(p.employee_id).includes(searchVal) || searchVal === '';
          const matchStatus = !statusVal || p.payment_status === statusVal;
          const matchPeriod = !periodVal || String(p.pay_period_id) === periodVal;
          return matchSearch && matchStatus && matchPeriod;
        });

        if (rows.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:24px;color:#64748b;">No records found.</td></tr>`;
          return;
        }

        const badgeClass = s => ({
          processed: 'badge-processed', pending: 'badge-pending',
          paid: 'badge-paid', void: 'badge-void'
        }[s] ?? '');

        const fica = p => ((p.social_security ?? 0) + (p.medicare ?? 0)).toFixed(2);

        tbody.innerHTML = rows.map(p => `
          <tr>
            <td><span class="name">${empName(p.employee_id)}</span>
                <span class="small">Check #${p.check_number ?? p.paycheck_id}</span></td>
            <td>${periodLabels[p.pay_period_id] ?? `Period #${p.pay_period_id}`}</td>
            <td class="amount">${fmt(p.gross_pay)}</td>
            <td>${fmt(p.federal_tax)}</td>
            <td>${fmt(p.state_tax)}</td>
            <td>$${fica(p)}</td>
            <td class="amount">${fmt(p.net_pay)}</td>
            <td><span class="badge ${badgeClass(p.payment_status)}">${p.payment_status ?? '—'}</span></td>
            <td style="display:flex;gap:6px;align-items:center;">
              ${p.payment_status !== 'paid' && p.payment_status !== 'void'
                ? `<button onclick="markPaid(${p.paycheck_id})" style="padding:5px 10px;font-size:0.8rem;border:none;border-radius:6px;background:#15803d;color:#fff;cursor:pointer;font-weight:600;">Mark Paid</button>`
                : ''}
              <button onclick="showPayStub(${p.paycheck_id})" style="padding:5px 10px;font-size:0.8rem;border:1px solid #d1d5db;border-radius:6px;background:#f8fbff;color:#1d4ed8;cursor:pointer;font-weight:600;">Pay Stub</button>
            </td>
          </tr>`).join('');
      } catch {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:24px;color:#ef4444;">Failed to load payroll data.</td></tr>`;
      }
    }

    // ── Create pay period ─────────────────────────────────────────
    async function submitPeriod(e) {
      e.preventDefault();
      try {
        const res = await fetch(`${API}/payperiods/create`, {
          method: 'POST',
          headers: hdrs,
          body: JSON.stringify({
            period_type:       document.getElementById('pp_type').value,
            period_start_date: document.getElementById('pp_start').value,
            period_end_date:   document.getElementById('pp_end').value,
            pay_date:          document.getElementById('pp_pay').value,
          })
        });
        const data = await res.json();
        if (!res.ok) { showStatus(data.detail ?? 'Failed to create pay period.', 'error'); return; }

        closeModal('periodModal');
        document.getElementById('periodForm').reset();
        showStatus(`Pay period created: ${data.period_start_date} – ${data.period_end_date}`, 'success');

        // Refresh selects and table
        document.getElementById('periodSelect').innerHTML = '<option value="">Select pay period to run…</option>';
        document.getElementById('periodFilter').innerHTML = '<option value="">All Pay Periods</option>';
        periodLabels = {};
        await loadPeriods();
        await loadPayroll();
      } catch {
        showStatus('Could not reach the server.', 'error');
      }
    }

    // ── Payroll preview ───────────────────────────────────────────
    async function previewPayroll() {
      const periodId = document.getElementById('periodSelect').value;
      if (!periodId) { showStatus('Select a pay period first.', 'error'); return; }

      const periodLabel = document.getElementById('periodSelect').options[document.getElementById('periodSelect').selectedIndex]?.text ?? `Period #${periodId}`;
      document.getElementById('previewPeriodLabel').textContent = `Estimated paychecks for: ${periodLabel}`;
      document.getElementById('previewBody').innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;color:#64748b;">Calculating…</td></tr>`;
      document.getElementById('previewFoot').innerHTML = '';
      document.getElementById('dlgPreview').showModal();

      const active = allEmployees.filter(e => e.employment_status === 'active');
      if (!active.length) {
        document.getElementById('previewBody').innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;color:#64748b;">No active employees found.</td></tr>`;
        return;
      }

      const results = await Promise.allSettled(
        active.map(e => fetch(`${API}/payroll/calculate/${e.employee_id}/${periodId}`, { headers: hdrs }).then(r => r.json()))
      );

      let totGross = 0, totNet = 0, totFed = 0, totState = 0, totFica = 0;
      const rows = [];

      results.forEach((r, i) => {
        const emp = active[i];
        const name = empName(emp.employee_id);
        if (r.status === 'rejected' || r.value?.detail) {
          rows.push(`<tr><td style="padding:8px 10px;">${name}</td><td colspan="5" style="padding:8px 10px;color:#ef4444;text-align:right;">No position/rate on file</td></tr>`);
          return;
        }
        const d = r.value;
        const fica = (d.social_security ?? 0) + (d.medicare ?? 0);
        totGross += d.gross_pay ?? 0; totNet += d.net_pay ?? 0;
        totFed   += d.federal_tax ?? 0; totState += d.state_tax ?? 0; totFica += fica;
        rows.push(`<tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:8px 10px;">${name}</td>
          <td style="padding:8px 10px;text-align:right;">${fmt(d.gross_pay)}</td>
          <td style="padding:8px 10px;text-align:right;">${fmt(d.federal_tax)}</td>
          <td style="padding:8px 10px;text-align:right;">${fmt(d.state_tax)}</td>
          <td style="padding:8px 10px;text-align:right;">${fmt(fica)}</td>
          <td style="padding:8px 10px;text-align:right;font-weight:700;">${fmt(d.net_pay)}</td>
        </tr>`);
      });

      document.getElementById('previewBody').innerHTML = rows.join('');
      document.getElementById('previewFoot').innerHTML = `
        <tr style="background:#f8fbff;font-weight:700;border-top:2px solid #e2e8f0;">
          <td style="padding:10px;">Totals (${results.length} employees)</td>
          <td style="padding:10px;text-align:right;">${fmt(totGross)}</td>
          <td style="padding:10px;text-align:right;">${fmt(totFed)}</td>
          <td style="padding:10px;text-align:right;">${fmt(totState)}</td>
          <td style="padding:10px;text-align:right;">${fmt(totFica)}</td>
          <td style="padding:10px;text-align:right;color:#1d4ed8;">${fmt(totNet)}</td>
        </tr>`;
    }

    // ── Run payroll ───────────────────────────────────────────────
    async function runPayroll() {
      const periodId = document.getElementById('periodSelect').value;
      if (!periodId) { showStatus('Select a pay period first.', 'error'); return; }

      const btn = document.getElementById('runBtn');
      btn.disabled = true;
      btn.textContent = 'Running…';
      showStatus('Running payroll…', 'info');

      try {
        const res = await fetch(`${API}/payroll/run/${periodId}`, {
          method: 'POST',
          headers: hdrs
        });
        const data = await res.json();
        if (!res.ok) { showStatus(data.detail ?? 'Payroll run failed.', 'error'); return; }

        if (data.paychecks_created === 0) {
          showStatus('No paychecks generated — make sure active employees have a position assigned with a salary or hourly rate.', 'error');
        } else {
          const activeCount = allEmployees.filter(e => e.employment_status === 'active').length;
          const skipped = activeCount - data.paychecks_created;
          const skipNote = skipped > 0 ? ` (${skipped} employee${skipped > 1 ? 's' : ''} skipped — no position assigned)` : '';
          showStatus(`Payroll complete — ${data.paychecks_created} paycheck(s) generated.${skipNote}`, 'success');
        }
        await loadPayroll();
      } catch {
        showStatus('Could not reach the server.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '▶ Run Payroll';
      }
    }

    // ── Mark paycheck as paid ─────────────────────────────────────
    async function markPaid(paycheckId) {
      try {
        const res = await fetch(`${API}/payroll/${paycheckId}/status`, {
          method: 'PATCH',
          headers: hdrs,
          body: JSON.stringify({ payment_status: 'paid', payment_date: new Date().toISOString().split('T')[0] })
        });
        if (!res.ok) { const d = await res.json(); showStatus(d.detail ?? 'Failed to update status.', 'error'); return; }
        showStatus('Paycheck marked as paid.', 'success');
        await loadPayroll();
      } catch { showStatus('Could not reach the server.', 'error'); }
    }

    // ── Pay stub modal ────────────────────────────────────────────
    function showPayStub(paycheckId) {
      const p = allPaychecks.find(x => x.paycheck_id === paycheckId);
      if (!p) return;

      const fmtN = n => n != null ? '$' + Number(n).toFixed(2) : '$0.00';
      const totalDeductions = [p.federal_tax, p.state_tax, p.social_security, p.medicare,
        p.health_insurance, p.retirement_401k, p.other_deductions]
        .reduce((s, v) => s + (Number(v) || 0), 0);

      document.getElementById('stubContent').innerHTML = `
        <div class="stub-header">
          <div class="stub-company">PayCentral</div>
          <div class="stub-title">Pay Stub</div>
        </div>
        <div class="stub-meta">
          <div><strong>Employee:</strong> ${empName(p.employee_id)}</div>
          <div><strong>Pay Period:</strong> ${periodLabels[p.pay_period_id] ?? `Period #${p.pay_period_id}`}</div>
          <div><strong>Check #:</strong> ${p.check_number ?? p.paycheck_id}</div>
          <div><strong>Payment Date:</strong> ${p.payment_date ?? '—'}</div>
          <div><strong>Status:</strong> ${p.payment_status ?? '—'}</div>
        </div>
        <table class="stub-table">
          <thead><tr><th colspan="2">Earnings</th></tr></thead>
          <tbody>
            <tr><td>Gross Pay</td><td class="amount">${fmtN(p.gross_pay)}</td></tr>
          </tbody>
        </table>
        <table class="stub-table">
          <thead><tr><th colspan="2">Deductions</th></tr></thead>
          <tbody>
            <tr><td>Federal Income Tax</td><td class="amount">${fmtN(p.federal_tax)}</td></tr>
            <tr><td>State Income Tax</td><td class="amount">${fmtN(p.state_tax)}</td></tr>
            <tr><td>Social Security</td><td class="amount">${fmtN(p.social_security)}</td></tr>
            <tr><td>Medicare</td><td class="amount">${fmtN(p.medicare)}</td></tr>
            <tr><td>Health Insurance</td><td class="amount">${fmtN(p.health_insurance)}</td></tr>
            <tr><td>401(k)</td><td class="amount">${fmtN(p.retirement_401k)}</td></tr>
            <tr><td>Other Deductions</td><td class="amount">${fmtN(p.other_deductions)}</td></tr>
            <tr class="stub-subtotal"><td>Total Deductions</td><td class="amount">${'$' + totalDeductions.toFixed(2)}</td></tr>
          </tbody>
        </table>
        <div class="stub-net">
          <span>Net Pay</span>
          <span>${fmtN(p.net_pay)}</span>
        </div>`;

      document.getElementById('dlgPayStub').showModal();
    }

    // ── Filters ───────────────────────────────────────────────────
    document.getElementById('searchInput').addEventListener('input', loadPayroll);
    document.getElementById('statusFilter').addEventListener('change', loadPayroll);
    document.getElementById('periodFilter').addEventListener('change', loadPayroll);

    // ── Init ──────────────────────────────────────────────────────
    (async () => { await loadEmployees(); await loadPeriods(); await loadPayroll(); })();
  </script>

  <!-- Pay Stub Dialog -->
  <dialog id="dlgPayStub" style="border:none;border-radius:12px;padding:0;width:480px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,0.25);">
    <div style="padding:24px 28px;">
      <div id="stubContent"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;">
        <button onclick="window.print()" style="padding:8px 18px;background:#1d4ed8;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.9rem;">Print</button>
        <button onclick="document.getElementById('dlgPayStub').close()" style="padding:8px 18px;background:#f3f4f6;color:#374151;border:1px solid #d1d5db;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.9rem;">Close</button>
      </div>
    </div>
  </dialog>

  <!-- Payroll Preview Dialog -->
  <dialog id="dlgPreview" style="border:none;border-radius:12px;padding:0;width:700px;max-width:96vw;box-shadow:0 20px 60px rgba(0,0,0,0.25);">
    <div style="padding:24px 28px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h3 style="margin:0;font-size:1.05rem;color:#0f172a;">Payroll Preview</h3>
        <button onclick="document.getElementById('dlgPreview').close()" style="background:none;border:none;font-size:1.3rem;cursor:pointer;color:#64748b;">✕</button>
      </div>
      <p id="previewPeriodLabel" style="font-size:0.85rem;color:#64748b;margin:0 0 14px;"></p>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
          <thead>
            <tr style="background:#f8fbff;">
              <th style="text-align:left;padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:0.72rem;text-transform:uppercase;color:#64748b;">Employee</th>
              <th style="text-align:right;padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:0.72rem;text-transform:uppercase;color:#64748b;">Gross</th>
              <th style="text-align:right;padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:0.72rem;text-transform:uppercase;color:#64748b;">Fed Tax</th>
              <th style="text-align:right;padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:0.72rem;text-transform:uppercase;color:#64748b;">State Tax</th>
              <th style="text-align:right;padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:0.72rem;text-transform:uppercase;color:#64748b;">FICA</th>
              <th style="text-align:right;padding:8px 10px;border-bottom:1px solid #e2e8f0;font-size:0.72rem;text-transform:uppercase;color:#64748b;font-weight:700;">Net Pay</th>
            </tr>
          </thead>
          <tbody id="previewBody"></tbody>
          <tfoot id="previewFoot"></tfoot>
        </table>
      </div>
      <div style="display:flex;justify-content:flex-end;margin-top:18px;">
        <button onclick="document.getElementById('dlgPreview').close()" style="padding:8px 18px;background:#f3f4f6;color:#374151;border:1px solid #d1d5db;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.9rem;">Close</button>
      </div>
    </div>
  </dialog>

  <style>
    dialog:not([open]) { display: none; }
    dialog::backdrop { background: rgba(0,0,0,0.45); }

    .stub-header { text-align:center; margin-bottom:16px; border-bottom:2px solid #1d4ed8; padding-bottom:12px; }
    .stub-company { font-size:1.4rem; font-weight:700; color:#1d4ed8; }
    .stub-title { font-size:0.9rem; color:#6b7280; text-transform:uppercase; letter-spacing:1px; }
    .stub-meta { display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; font-size:0.85rem; margin-bottom:16px; color:#374151; }
    .stub-table { width:100%; border-collapse:collapse; margin-bottom:12px; font-size:0.85rem; }
    .stub-table th { background:#f1f5f9; text-align:left; padding:6px 10px; font-size:0.8rem; color:#374151; text-transform:uppercase; letter-spacing:0.5px; }
    .stub-table td { padding:5px 10px; border-bottom:1px solid #e5e7eb; }
    .stub-table td.amount { text-align:right; font-variant-numeric:tabular-nums; }
    .stub-subtotal td { font-weight:600; color:#374151; border-top:2px solid #d1d5db; border-bottom:none; }
    .stub-net { display:flex; justify-content:space-between; align-items:center; background:#1d4ed8; color:#fff; border-radius:8px; padding:12px 16px; font-size:1.05rem; font-weight:700; margin-top:4px; }

    @media print {
      body > *:not(#dlgPayStub) { display: none !important; }
      #dlgPayStub { display: block !important; position: static; box-shadow: none; width: 100%; }
      #dlgPayStub button { display: none; }
      dialog::backdrop { display: none; }
    }
  </style>
</body>
</html>
