<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <style>
    :root {
      --bg: #f6f9fc;
      --text: #1f2937;
      --surface: #ffffff;
      --border: #d1d5db;
      --accent: #0f766e;
      --muted: #6b7280;
    }

    body.dark {
      --bg: #0b1220;
      --surface: #111827;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --accent: #14b8a6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #1d4ed8;
      border-bottom: 1px solid #1e40af;
      position: relative;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      color: #ffffff;
    }

    main {
      padding: 24px 20px;
    }

    .settings-card {
      max-width: 560px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .settings-card p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }

    .setting-row label {
      font-weight: 600;
    }

    .switch {
      position: relative;
      width: 52px;
      height: 30px;
      display: inline-block;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #9ca3af;
      transition: .2s;
      border-radius: 999px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 4px;
      top: 4px;
      background: #fff;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    .menu-wrap {
      position: relative;
    }

    .menu-btn {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 0;
    }

    .menu-btn span {
      width: 20px;
      height: 2px;
      background: #ffffff;
      border-radius: 10px;
      display: block;
    }

    .menu {
      position: absolute;
      right: 0;
      top: 50px;
      min-width: 210px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 8px;
      display: none;
      z-index: 20;
    }

    .menu.open {
      display: block;
    }

    .menu a {
      display: block;
      text-decoration: none;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .menu a:hover {
      background: #ecfeff;
      color: var(--accent);
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 24px 0 14px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      color: var(--text);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.93rem;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 3px rgba(29,78,216,0.12);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-create {
      margin-top: 4px;
      width: 100%;
      padding: 10px;
      background: #1d4ed8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .btn-create:hover { background: #1e40af; }

    .status-msg {
      margin-top: 10px;
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
    }

    .status-msg.success { background: #d1fae5; color: #065f46; display: block; }
    .status-msg.error   { background: #fee2e2; color: #991b1b; display: block; }

    .admin-only { display: none; }
  </style>
  <link rel="stylesheet" href="app-theme.css">
  <script src="config.js"></script>
  <script src="app-shell.js"></script>
</head>
<body>
  <header class="topbar">
  <div class="topbar-left">
    <a href="homepage.html" class="brand">
      <div class="brand-logo">
        <img src="PAY CENTRAL LOGO.png" alt="PayCentral logo">
      </div>
      <div class="brand-text">
        <h1>PayCentral</h1>
        <p>Settings</p>
      </div>
    </a>
  </div>
  <div class="topbar-actions">
    <button class="top-btn" id="themeToggle" type="button">Toggle Theme</button>
      <div class="menu-wrap">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="hrMenu">
          <span></span><span></span><span></span>
        </button>
        <nav class="menu" id="hrMenu" aria-hidden="true">
          <a href="homepage.html">Home</a>
          <a href="profile.html">Profile</a>
          <a href="employees.html">Employees</a>
          <a href="departments.html">Departments</a>
          <a href="shifts.html">Shifts</a>
          <a href="payroll.html">Payroll</a>
          <a href="benefits.html">Benefits</a>
          <a href="taxes.html">Taxes</a>
          <a href="reports.html">Reports</a>
          <a href="audit.html">Audit Log</a>
          <a href="settings.html">Settings</a>
          <a href="logout.html" class="signout">Sign Out</a>
        </nav>
      </div>  </div>
</header>

  <main>
    <section class="settings-card">
      <p>Manage your app preferences.</p>

      <div class="setting-row">
        <label for="darkModeToggle">Dark mode</label>
        <label class="switch" aria-label="Toggle dark mode">
          <input type="checkbox" id="darkModeToggle">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Admin only: Create User -->
      <div class="admin-only" id="createUserSection">
        <p class="section-title">Create User Account</p>

        <div class="form-grid">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="cu_first_name" placeholder="Jane">
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="cu_last_name" placeholder="Doe">
          </div>
        </div>

        <div class="form-group">
          <label>Username</label>
          <input type="text" id="cu_username" placeholder="jane.doe" autocomplete="off">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="cu_password" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label>Role</label>
          <select id="cu_role">
            <option value="hr">HR</option>
            <option value="manager">Manager</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="form-group" id="departmentGroup" style="display:none;">
          <label>Department <span style="font-weight:400;color:var(--muted);">(required for Manager)</span></label>
          <input type="text" id="cu_department" placeholder="e.g. Engineering">
        </div>

        <button class="btn-create" id="createUserBtn">Create User</button>
        <div class="status-msg" id="createUserMsg"></div>
      </div>

      <!-- Admin only: Reset Password -->
      <div class="admin-only" id="resetPasswordSection">
        <p class="section-title">Reset User Password</p>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="rp_username" placeholder="Enter username to reset" autocomplete="off">
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="rp_password" autocomplete="new-password">
        </div>
        <button class="btn-create" id="resetPasswordBtn">Reset Password</button>
        <div class="status-msg" id="resetPasswordMsg"></div>
      </div>

      <!-- Admin only: Login Logs -->
      <div class="admin-only" id="loginLogsSection">
        <p class="section-title">Recent Login Attempts</p>
        <div style="overflow-x:auto;border:1px solid var(--border);border-radius:8px;">
          <table style="width:100%;border-collapse:collapse;font-size:0.88rem;">
            <thead>
              <tr style="background:#f8fbff;">
                <th style="padding:9px 12px;text-align:left;color:#475569;font-weight:600;border-bottom:1px solid var(--border);">Username</th>
                <th style="padding:9px 12px;text-align:left;color:#475569;font-weight:600;border-bottom:1px solid var(--border);">IP Address</th>
                <th style="padding:9px 12px;text-align:left;color:#475569;font-weight:600;border-bottom:1px solid var(--border);">Result</th>
                <th style="padding:9px 12px;text-align:left;color:#475569;font-weight:600;border-bottom:1px solid var(--border);">Time</th>
              </tr>
            </thead>
            <tbody id="loginLogsBody">
              <tr><td colspan="4" style="padding:20px;text-align:center;color:var(--muted);">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const hrMenu = document.getElementById('hrMenu');
    const toggle = document.getElementById('darkModeToggle');
    const STORAGE_KEY = 'payroll_dark_mode';

    menuBtn.addEventListener('click', () => {
      const isOpen = hrMenu.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', String(isOpen));
      hrMenu.setAttribute('aria-hidden', String(!isOpen));
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.menu-wrap')) {
        hrMenu.classList.remove('open');
        menuBtn.setAttribute('aria-expanded', 'false');
        hrMenu.setAttribute('aria-hidden', 'true');
      }
    });

    requireAuth();
    const role  = localStorage.getItem('user_role');
    const token = getToken();

    // Show admin-only sections
    if (role === 'admin') {
      document.getElementById('createUserSection').style.display = 'block';
      document.getElementById('resetPasswordSection').style.display = 'block';
      document.getElementById('loginLogsSection').style.display = 'block';
      loadLoginLogs();
    }

    // Show Employee ID field only when role is Manager
    document.getElementById('cu_role').addEventListener('change', function () {
      document.getElementById('departmentGroup').style.display =
        this.value === 'manager' ? 'block' : 'none';
    });

    document.getElementById('createUserBtn').addEventListener('click', async () => {
      const msg        = document.getElementById('createUserMsg');
      const username   = document.getElementById('cu_username').value.trim();
      const password   = document.getElementById('cu_password').value;
      const firstName  = document.getElementById('cu_first_name').value.trim();
      const lastName   = document.getElementById('cu_last_name').value.trim();
      const userRole        = document.getElementById('cu_role').value;
      const departmentName  = document.getElementById('cu_department').value.trim();

      msg.className = 'status-msg';
      msg.textContent = '';

      if (!username || !password) {
        msg.className = 'status-msg error';
        msg.textContent = 'Username and password are required.';
        return;
      }

      if (userRole === 'manager' && !departmentName) {
        msg.className = 'status-msg error';
        msg.textContent = 'Department name is required for a Manager account.';
        return;
      }

      try {
        const res = await fetch(`${API}/auth/create`, {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({
            username,
            password,
            first_name:  firstName   || null,
            last_name:   lastName    || null,
            role:            userRole,
            department_name: departmentName || null
          })
        });

        const data = await res.json();

        if (!res.ok) {
          msg.className = 'status-msg error';
          msg.textContent = data.detail ?? 'Failed to create user.';
          return;
        }

        msg.className = 'status-msg success';
        msg.textContent = `User "${data.username}" created successfully.`;

        // clear form
        ['cu_username', 'cu_password', 'cu_first_name', 'cu_last_name', 'cu_department'].forEach(id => {
          document.getElementById(id).value = '';
        });
        document.getElementById('cu_role').value = 'hr';
        document.getElementById('departmentGroup').style.display = 'none';
      } catch {
        msg.className = 'status-msg error';
        msg.textContent = 'Could not reach the server.';
      }
    });

    // ── Reset Password ────────────────────────────────────────────────────
    document.getElementById('resetPasswordBtn').addEventListener('click', async () => {
      const msg      = document.getElementById('resetPasswordMsg');
      const username = document.getElementById('rp_username').value.trim();
      const password = document.getElementById('rp_password').value;
      msg.className = 'status-msg';
      msg.textContent = '';
      if (!username || !password) {
        msg.className = 'status-msg error';
        msg.textContent = 'Username and new password are required.';
        return;
      }
      try {
        const res = await fetch(`${API}/auth/reset-password`, {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ username, new_password: password })
        });
        const data = await res.json();
        if (!res.ok) {
          msg.className = 'status-msg error';
          msg.textContent = data.detail ?? 'Failed to reset password.';
          return;
        }
        msg.className = 'status-msg success';
        msg.textContent = data.detail;
        document.getElementById('rp_username').value = '';
        document.getElementById('rp_password').value = '';
      } catch {
        msg.className = 'status-msg error';
        msg.textContent = 'Could not reach the server.';
      }
    });

    // ── Login Logs ────────────────────────────────────────────────────────
    async function loadLoginLogs() {
      const tbody = document.getElementById('loginLogsBody');
      try {
        const res = await fetch(`${API}/auth/logs`, {
          headers: authHeaders({ 'Content-Type': 'application/json' })
        });
        if (!res.ok) throw new Error(res.status);
        const logs = await res.json();
        if (!logs.length) {
          tbody.innerHTML = '<tr><td colspan="4" style="padding:20px;text-align:center;color:var(--muted);">No login attempts recorded yet.</td></tr>';
          return;
        }
        tbody.innerHTML = logs.map(l => `<tr>
          <td style="padding:8px 12px;">${l.username}</td>
          <td style="padding:8px 12px;color:var(--muted);">${l.ip_address ?? '—'}</td>
          <td style="padding:8px 12px;">${l.success
            ? '<span style="background:#dcfce7;color:#166534;padding:2px 8px;border-radius:20px;font-size:0.78rem;font-weight:600;">Success</span>'
            : '<span style="background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:20px;font-size:0.78rem;font-weight:600;">Failed</span>'
          }</td>
          <td style="padding:8px 12px;color:var(--muted);font-size:0.85rem;">${l.attempted_at}</td>
        </tr>`).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" style="padding:20px;text-align:center;color:#991b1b;">Failed to load logs: ${err.message}</td></tr>`;
      }
    }

    const savedTheme = localStorage.getItem(STORAGE_KEY);
    if (savedTheme === 'enabled') {
      document.body.classList.add('dark');
      toggle.checked = true;
    }

    toggle.addEventListener('change', () => {
      if (toggle.checked) {
        document.body.classList.add('dark');
        localStorage.setItem(STORAGE_KEY, 'enabled');
      } else {
        document.body.classList.remove('dark');
        localStorage.setItem(STORAGE_KEY, 'disabled');
      }
    });
  </script>
</body>
</html>
