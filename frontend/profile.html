<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>
  <style>
    :root {
      --bg: #f6f9fc;
      --text: #1f2937;
      --muted: #6b7280;
      --surface: #ffffff;
      --border: #d1d5db;
      --accent: #0f766e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--primary);
      border-bottom: 1px solid var(--primary-dark);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      color: #ffffff;
    }

    main {
      padding: 24px 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 780px;
    }

    .profile-card h2 {
      margin: 0 0 4px;
      font-size: 1.3rem;
    }

    .role-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 20px;
    }

    .role-badge.admin   { background: #fef3c7; color: #92400e; }
    .role-badge.manager { background: #dbeafe; color: #1e40af; }
    .role-badge.hr      { background: #d1fae5; color: #065f46; }

    .info-grid {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 12px 0;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .info-grid dt {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 600;
      padding: 2px 0;
    }

    .info-grid dd {
      margin: 0;
      font-size: 0.95rem;
      padding: 2px 0;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 0 0 14px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--muted);
    }

    .form-group input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--bg);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .btn {
      padding: 9px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    .btn:hover { opacity: 0.9; }

    .msg {
      font-size: 0.85rem;
      margin-top: 10px;
      min-height: 1.2em;
    }

    .msg.success { color: #16a34a; }
    .msg.error   { color: #dc2626; }

    .menu-wrap { position: relative; }

    .menu-btn {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 0;
    }

    .menu-btn span {
      width: 20px;
      height: 2px;
      background: #ffffff;
      border-radius: 10px;
      display: block;
    }

    .menu {
      position: absolute;
      right: 0;
      top: 50px;
      min-width: 210px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      padding: 8px;
      display: none;
      z-index: 20;
    }

    .menu.open { display: block; }

    .menu a {
      display: block;
      text-decoration: none;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .menu a:hover {
      background: #ecfeff;
      color: var(--accent);
    }

    .page-header {
      margin-bottom: 20px;
    }

    .page-header h2 {
      margin: 0;
      font-size: 1.7rem;
    }

    .page-header p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      align-items: start;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .profile-card {
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1d4ed8, #0f766e);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 2rem;
      font-weight: 700;
    }

    .profile-card h3 {
      margin: 0;
      font-size: 1.3rem;
    }

    .profile-card p {
      margin: 6px 0;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--success-bg);
      color: var(--success-text);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .mini-stats {
      margin-top: 20px;
      display: grid;
      gap: 12px;
    }

    .mini-stat {
      padding: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #f9fafb;
      text-align: left;
    }

    .mini-stat strong {
      display: block;
      font-size: 1.1rem;
      margin-top: 4px;
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 1.1rem;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .info-box {
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #f9fafb;
    }

    .info-box span {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .info-box strong {
      font-size: 1rem;
    }

    form {
      margin-top: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 14px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      background: #fff;
      font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid rgba(29, 78, 216, 0.15);
      border-color: var(--primary);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .form-actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }

    @media (max-width: 950px) {
      .layout-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      main {
        padding: 18px 14px 30px;
      }

      .info-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Profile</h1>

    <div class="menu-wrap">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="hrMenu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="menu" id="hrMenu" aria-hidden="true">
        <a href="template_main_page.html">Home</a>
        <a href="profile.html">Profile</a>
        <a href="employees.html">Employees</a>
        <a href="shifts.html">Shifts</a>
        <a href="payroll.html">Payroll</a>
        <a href="benefits.html">Benefits</a>
        <a href="taxes_and_reports.html">Taxes &amp; Reports</a>
        <a href="settings.html">Settings</a>
        <a href="logout.html" style="color:#ef4444;">Sign Out</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="card">
      <p>Profile page content goes here.</p>
    </section>
  </main>

  <script>
    if (localStorage.getItem('payroll_dark_mode') === 'enabled') {
      document.body.classList.add('dark');
    }

    const API = 'http://127.0.0.1:8000';

    // --- Redirect to login on 401 ---
    function handleUnauthorized(res) {
      if (res.status === 401) {
        localStorage.removeItem('access_token');
        localStorage.removeItem('user_role');
        window.location.href = 'login.html';
        return true;
      }
      return false;
    }

    // --- Nav menu ---
    const menuBtn = document.getElementById('menuBtn');
    const hrMenu  = document.getElementById('hrMenu');

    menuBtn.addEventListener('click', () => {
      const isOpen = hrMenu.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', String(isOpen));
      hrMenu.setAttribute('aria-hidden', String(!isOpen));
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.menu-wrap')) {
        hrMenu.classList.remove('open');
        menuBtn.setAttribute('aria-expanded', 'false');
        hrMenu.setAttribute('aria-hidden', 'true');
      }
    });
  </script>
</body>
</html>a
