<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shifts</title>
  <style>
    :root {
      --bg: #eef3f9;
      --text: #1f2937;
      --surface: #ffffff;
      --border: #d4dde8;
      --accent: #0f766e;
      --primary: #1d4ed8;
      --primary-dark: #1e40af;
      --muted: #64748b;
      --table-border: #dbe5f0;
    }

    body.dark {
      --bg: #0b1220;
      --surface: #111827;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --accent: #14b8a6;
      --table-border: #374151;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at top left, #dbeafe 0%, transparent 35%),
        radial-gradient(circle at top right, #e0f2fe 0%, transparent 30%),
        var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--primary);
      border-bottom: 1px solid var(--primary-dark);
      position: relative;
    }

    h1 { margin: 0; font-size: 1.3rem; color: #fff; }

    .menu-wrap { position: relative; }

    .menu-btn {
      width: 42px; height: 42px;
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 8px;
      background: rgba(255,255,255,0.12);
      cursor: pointer;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 5px; padding: 0;
    }

    .menu-btn span {
      width: 20px; height: 2px;
      background: #fff; border-radius: 10px; display: block;
    }

    .menu {
      position: absolute; right: 0; top: 50px;
      min-width: 210px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 8px; display: none; z-index: 20;
    }

    .menu.open { display: block; }

    .menu a {
      display: block; text-decoration: none;
      color: var(--text); padding: 10px 12px;
      border-radius: 8px; font-size: 0.95rem;
    }

    .menu a:hover { background: #ecfeff; color: var(--accent); }

    main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 40px; }

    .toolbar {
      display: flex; gap: 12px; align-items: center;
      flex-wrap: wrap; margin-bottom: 16px;
    }

    .toolbar input, .toolbar select {
      padding: 8px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 0.95rem;
      background: var(--surface); color: var(--text);
      font-family: inherit;
    }

    .toolbar input { flex: 1; min-width: 180px; }

    .btn {
      padding: 8px 16px; border: none; border-radius: 8px;
      cursor: pointer; font-size: 0.95rem; font-family: inherit;
      font-weight: 600;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }

    .table-shell {
      background: var(--surface);
      border: 1px solid var(--table-border);
      border-radius: 12px; padding: 12px;
      box-shadow: 0 10px 20px rgba(15,23,42,0.06);
    }

    .table-card {
      background: var(--surface);
      border: 1px solid var(--table-border);
      border-radius: 10px; overflow-x: auto;
    }

    table { width: 100%; min-width: 820px; border-collapse: collapse; }

    thead th {
      font-size: 0.95rem; font-weight: 600; text-align: left;
      color: #334155; background: #f8fbff;
      border-bottom: 1px solid var(--table-border);
      padding: 12px 14px;
    }

    tbody td {
      padding: 11px 14px; color: #374151;
      font-size: 0.95rem; vertical-align: middle;
    }

    tbody tr + tr td { border-top: 1px solid var(--table-border); }
    tbody tr:nth-child(even) td { background: #fcfdff; }

    .badge {
      display: inline-block; padding: 2px 9px;
      border-radius: 20px; font-size: 0.82rem; font-weight: 600;
    }

    .badge-approved { background: #dcfce7; color: #166534; }
    .badge-pending  { background: #fef9c3; color: #854d0e; }

    .type-badge {
      display: inline-block; padding: 2px 8px;
      border-radius: 6px; font-size: 0.82rem;
      background: #e0f2fe; color: #0369a1;
    }

    .action-btn {
      padding: 4px 10px; border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer; font-size: 0.85rem;
      background: var(--surface); color: var(--text);
    }

    .action-btn:hover { background: #f0f9ff; border-color: var(--primary); color: var(--primary); }

    /* Modal */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); z-index: 100;
      justify-content: center; align-items: center;
    }

    .overlay.open { display: flex; }

    .modal {
      background: var(--surface); border-radius: 14px;
      padding: 28px; width: 100%; max-width: 480px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    .modal h2 { margin: 0 0 20px; font-size: 1.15rem; color: #0f172a; }

    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.88rem; color: var(--muted); margin-bottom: 4px; }

    .field input, .field select, .field textarea {
      width: 100%; padding: 8px 10px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 0.95rem; font-family: inherit; color: var(--text);
    }

    .field textarea { resize: vertical; min-height: 60px; }

    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

    .btn-ghost {
      background: transparent; border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-ghost:hover { background: #f1f5f9; }

    #formError {
      color: #ef4444; font-size: 0.88rem; margin-top: 8px; display: none;
    }

    /* ── View tabs ── */
    .view-tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 2px solid var(--border); }
    .view-tab {
      padding: 9px 20px; border: none; background: none; cursor: pointer;
      font-size: 0.95rem; font-weight: 600; color: var(--muted);
      border-bottom: 3px solid transparent; margin-bottom: -2px; font-family: inherit;
    }
    .view-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .view-tab:hover:not(.active) { color: var(--text); }

    /* ── Week nav ── */
    .week-nav {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px; flex-wrap: wrap;
    }
    .week-nav-btn {
      width: 34px; height: 34px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface); color: var(--text);
      font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .week-nav-btn:hover { background: #f0f4ff; border-color: var(--primary); color: var(--primary); }
    .week-label { font-weight: 600; font-size: 0.95rem; min-width: 200px; }
    .today-btn {
      padding: 6px 14px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface); color: var(--text);
      font-size: 0.88rem; cursor: pointer; font-family: inherit;
    }
    .today-btn:hover { background: #f0f4ff; color: var(--primary); border-color: var(--primary); }
    .add-shift-btn {
      margin-left: auto; padding: 7px 16px;
      background: var(--primary); color: #fff;
      border: none; border-radius: 8px; font-size: 0.88rem;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .add-shift-btn:hover { background: var(--primary-dark); }

    /* ── Schedule grid ── */
    .schedule-wrap { overflow-x: auto; }
    .schedule-table { width: 100%; border-collapse: collapse; min-width: 700px; }
    .schedule-table th {
      background: #f8fbff; border: 1px solid var(--table-border);
      padding: 8px 10px; font-size: 0.82rem; font-weight: 600;
      color: var(--muted); text-align: center; min-width: 110px; white-space: nowrap;
    }
    .schedule-table th.today-col { background: #dbeafe; color: var(--primary); }
    .schedule-table td {
      border: 1px solid var(--table-border); padding: 6px 8px;
      vertical-align: top; min-height: 60px; height: 60px;
    }
    .schedule-table td.emp-col {
      background: #f8fbff; font-weight: 600; font-size: 0.88rem;
      min-width: 130px; white-space: nowrap; color: var(--text); text-align: left;
    }
    .schedule-table td.today-col { background: #eff6ff; }
    .schedule-table td.empty-cell {
      cursor: pointer; transition: background 0.12s;
    }
    .schedule-table td.empty-cell:hover { background: #f0f9ff; }
    .schedule-table td.empty-cell:hover::after {
      content: '+'; display: block; text-align: center;
      color: var(--primary); font-size: 1.2rem; font-weight: 300; line-height: 2;
    }
    .shift-block {
      border-radius: 6px; padding: 3px 7px; font-size: 0.78rem;
      font-weight: 600; margin-bottom: 3px; cursor: default;
      display: flex; justify-content: space-between; align-items: center; gap: 4px;
    }
    .shift-block .del-btn {
      background: none; border: none; cursor: pointer;
      color: inherit; opacity: 0.6; font-size: 0.85rem; padding: 0 2px; line-height: 1;
    }
    .shift-block .del-btn:hover { opacity: 1; }
    .shift-work     { background: #dbeafe; color: #1e40af; }
    .shift-sick     { background: #fef9c3; color: #854d0e; }
    .shift-vacation { background: #dcfce7; color: #166534; }
    .shift-holiday  { background: #ede9fe; color: #5b21b6; }
    .shift-unpaid   { background: #f3f4f6; color: #374151; }
    .no-emp { text-align: center; color: var(--muted); font-style: italic; padding: 32px; }
  </style>
  <link rel="stylesheet" href="app-theme.css">
  <script src="config.js"></script>
  <script src="app-shell.js"></script>
</head>
<body>
  <header class="topbar">
  <div class="topbar-left">
    <a href="homepage.html" class="brand">
      <div class="brand-logo">
        <img src="PAY CENTRAL LOGO.png" alt="PayCentral logo">
      </div>
      <div class="brand-text">
        <h1>PayCentral</h1>
        <p>Shifts</p>
      </div>
    </a>
  </div>
  <div class="topbar-actions">
    <button class="top-btn" id="themeToggle" type="button">Toggle Theme</button>
      <div class="menu-wrap">
        <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="hrMenu">
          <span></span><span></span><span></span>
        </button>
        <nav class="menu" id="hrMenu" aria-hidden="true">
          <a href="homepage.html">Home</a>
          <a href="profile.html">Profile</a>
          <a href="employees.html">Employees</a>
          <a href="departments.html">Departments</a>
          <a href="shifts.html">Shifts</a>
          <a href="payroll.html">Payroll</a>
          <a href="benefits.html">Benefits</a>
          <a href="taxes.html">Taxes</a>
          <a href="reports.html">Reports</a>
          <a href="audit.html">Audit Log</a>
          <a href="settings.html">Settings</a>
          <a href="logout.html" class="signout">Sign Out</a>
        </nav>
      </div>  </div>
</header>

  <main>
    <div class="view-tabs">
      <button class="view-tab active" id="tabSchedule" onclick="switchView('schedule')">Weekly Schedule</button>
      <button class="view-tab" id="tabEntries" onclick="switchView('entries')">All Entries</button>
    </div>

    <!-- Schedule View -->
    <div id="scheduleView">
      <div class="week-nav">
        <button class="week-nav-btn" onclick="prevWeek()">‹</button>
        <span class="week-label" id="weekLabel"></span>
        <button class="week-nav-btn" onclick="nextWeek()">›</button>
        <button class="today-btn" onclick="goToday()">Today</button>
        <button class="add-shift-btn" onclick="openAddModal()">+ Add Shift</button>
      </div>
      <div class="schedule-wrap">
        <table class="schedule-table" id="scheduleGrid"></table>
      </div>
    </div>

    <!-- Entries View -->
    <div id="entriesView" style="display:none;">
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Search by employee ID">
        <select id="typeFilter">
          <option value="">All Types</option>
          <option value="work">Work</option>
          <option value="sick">Sick</option>
          <option value="vacation">Vacation</option>
          <option value="holiday">Holiday</option>
          <option value="unpaid">Unpaid</option>
        </select>
        <select id="approvedFilter">
          <option value="">All Statuses</option>
          <option value="true">Approved</option>
          <option value="false">Pending</option>
        </select>
        <button class="btn btn-primary" id="addBtn">+ Log Entry</button>
      </div>
      <section class="table-shell">
        <div class="table-card">
          <table>
            <thead>
              <tr>
                <th>Entry ID</th><th>Employee</th><th>Date</th>
                <th>Clock In</th><th>Clock Out</th>
                <th>Reg Hrs</th><th>OT Hrs</th>
                <th>Type</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="shiftsBody">
              <tr><td colspan="10" style="text-align:center;padding:24px;color:#64748b;">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <!-- Log Entry Modal -->
  <div class="overlay" id="entryOverlay">
    <div class="modal">
      <h2 id="modalTitle">Schedule Shift</h2>
      <div class="field">
        <label>Employee</label>
        <select id="fEmployeeId">
          <option value="">— Select Employee —</option>
        </select>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="fDate">
      </div>
      <div class="field">
        <label>Clock In</label>
        <input type="time" id="fClockIn">
      </div>
      <div class="field">
        <label>Clock Out</label>
        <input type="time" id="fClockOut">
      </div>
      <div class="field">
        <label>Regular Hours</label>
        <input type="number" step="0.25" id="fRegHours" placeholder="e.g. 8">
      </div>
      <div class="field">
        <label>Overtime Hours</label>
        <input type="number" step="0.25" id="fOtHours" placeholder="e.g. 0">
      </div>
      <div class="field">
        <label>Entry Type</label>
        <select id="fType">
          <option value="work">Work</option>
          <option value="sick">Sick</option>
          <option value="vacation">Vacation</option>
          <option value="holiday">Holiday</option>
          <option value="unpaid">Unpaid</option>
        </select>
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="fNotes" placeholder="Optional notes…"></textarea>
      </div>
      <div id="formError"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('payroll_dark_mode') === 'enabled') document.body.classList.add('dark');

    requireAuth({ roles: ['admin', 'hr', 'manager'] });
    const token = getToken();
    const role  = localStorage.getItem('user_role');

    const headers = authHeaders({ 'Content-Type': 'application/json' });

    // ── Menu ─────────────────────────────────────────────────────
    const menuBtn = document.getElementById('menuBtn');
    const hrMenu  = document.getElementById('hrMenu');
    menuBtn.addEventListener('click', () => {
      const open = hrMenu.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', String(open));
      hrMenu.setAttribute('aria-hidden', String(!open));
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.menu-wrap')) {
        hrMenu.classList.remove('open');
        menuBtn.setAttribute('aria-expanded', 'false');
        hrMenu.setAttribute('aria-hidden', 'true');
      }
    });

    // ── View toggle ──────────────────────────────────────────────
    function switchView(view) {
      document.getElementById('scheduleView').style.display = view === 'schedule' ? '' : 'none';
      document.getElementById('entriesView').style.display  = view === 'entries'  ? '' : 'none';
      document.getElementById('tabSchedule').classList.toggle('active', view === 'schedule');
      document.getElementById('tabEntries').classList.toggle('active', view === 'entries');
      if (view === 'entries') loadEntries();
    }

    // ── Weekly schedule ──────────────────────────────────────────
    let allEmployees = [];
    let allEntries   = [];
    let weekStart    = getMonday(new Date());

    function getMonday(d) {
      const dt = new Date(d);
      const day = dt.getDay();
      dt.setDate(dt.getDate() - (day === 0 ? 6 : day - 1));
      dt.setHours(0,0,0,0);
      return dt;
    }

    function fmtDate(d) {
      return d.toISOString().split('T')[0];
    }

    function fmtShort(d) {
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function weekDays() {
      return Array.from({length: 7}, (_, i) => {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + i);
        return d;
      });
    }

    function prevWeek() { weekStart.setDate(weekStart.getDate() - 7); renderSchedule(); }
    function nextWeek() { weekStart.setDate(weekStart.getDate() + 7); renderSchedule(); }
    function goToday()  { weekStart = getMonday(new Date()); renderSchedule(); }

    function openAddModal(empId, dateStr) {
      document.getElementById('formError').style.display = 'none';
      if (empId)   document.getElementById('fEmployeeId').value = empId;
      if (dateStr) document.getElementById('fDate').value = dateStr;
      document.getElementById('entryOverlay').classList.add('open');
    }

    async function loadScheduleData() {
      try {
        const [eRes, tRes] = await Promise.all([
          fetch(`${API}/employee/all`, { headers }),
          fetch(`${API}/timeentries/all`, { headers })
        ]);
        allEmployees = eRes.ok  ? (await eRes.json()).filter(e => e.employment_status === 'active') : [];
        allEntries   = tRes.ok  ? await tRes.json() : [];
        const sel = document.getElementById('fEmployeeId');
        sel.innerHTML = '<option value="">— Select Employee —</option>';
        allEmployees.forEach(e => {
          const opt = new Option(`${e.first_name} ${e.last_name}`, e.employee_id);
          sel.appendChild(opt);
        });
      } catch (_) {}
      renderSchedule();
    }

    function renderSchedule() {
      const days  = weekDays();
      const today = fmtDate(new Date());

      // Update week label
      document.getElementById('weekLabel').textContent =
        `${fmtShort(days[0])} – ${fmtShort(days[6])}, ${days[0].getFullYear()}`;

      const typeClass = t => ({ work:'shift-work', sick:'shift-sick', vacation:'shift-vacation',
        holiday:'shift-holiday', unpaid:'shift-unpaid' }[t] ?? 'shift-work');

      const grid = document.getElementById('scheduleGrid');

      if (!allEmployees.length) {
        grid.innerHTML = `<tr><td class="no-emp" colspan="8">No active employees found.</td></tr>`;
        return;
      }

      const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

      // Header row
      let html = '<thead><tr><th style="text-align:left;min-width:130px;">Employee</th>';
      days.forEach((d, i) => {
        const isTod = fmtDate(d) === today;
        html += `<th class="${isTod ? 'today-col' : ''}">${dayNames[i]}<br><span style="font-weight:400;">${fmtShort(d)}</span></th>`;
      });
      html += '</tr></thead><tbody>';

      // Employee rows
      allEmployees.forEach(emp => {
        html += `<tr><td class="emp-col">${emp.first_name} ${emp.last_name}</td>`;
        days.forEach(d => {
          const ds = fmtDate(d);
          const isTod = ds === today;
          const dayEntries = allEntries.filter(e => e.employee_id === emp.employee_id && e.entry_date === ds);

          if (dayEntries.length) {
            html += `<td class="${isTod ? 'today-col' : ''}">`;
            dayEntries.forEach(e => {
              const hrs = e.regular_hours != null ? `${e.regular_hours}h` : (e.clock_in ? e.clock_in.slice(0,5) : '');
              html += `<div class="shift-block ${typeClass(e.entry_type)}">
                <span>${e.entry_type ?? 'work'}${hrs ? ' · ' + hrs : ''}</span>
                <button class="del-btn" onclick="deleteScheduleEntry(${e.entry_id})" title="Remove">✕</button>
              </div>`;
            });
            html += `</td>`;
          } else {
            html += `<td class="empty-cell${isTod ? ' today-col' : ''}" onclick="openAddModal(${emp.employee_id}, '${ds}')"></td>`;
          }
        });
        html += '</tr>';
      });

      html += '</tbody>';
      grid.innerHTML = html;
    }

    async function deleteScheduleEntry(id) {
      if (!confirm('Remove this shift?')) return;
      const res = await fetch(`${API}/timeentries/${id}`, { method: 'DELETE', headers });
      if (res.ok) {
        allEntries = allEntries.filter(e => e.entry_id !== id);
        renderSchedule();
      }
    }

    // ── Entries list ─────────────────────────────────────────────
    async function loadEntries() {
      const tbody      = document.getElementById('shiftsBody');
      const searchVal  = document.getElementById('searchInput').value.toLowerCase();
      const typeVal    = document.getElementById('typeFilter').value;
      const approvedVal= document.getElementById('approvedFilter').value;

      try {
        const res = await fetch(`${API}/timeentries/all`, { headers });
        if (res.status === 401) {
          tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:24px;color:#ef4444;">Session expired.</td></tr>`;
          return;
        }
        const entries = await res.json();
        const rows = entries.filter(e => {
          const searchMatch = searchVal === '' || String(e.employee_id).includes(searchVal);
          const typeMatch   = !typeVal || e.entry_type === typeVal;
          const apprMatch   = !approvedVal
            || (approvedVal === 'true'  && e.approved === true)
            || (approvedVal === 'false' && e.approved !== true);
          return searchMatch && typeMatch && apprMatch;
        });
        if (!rows.length) {
          tbody.innerHTML = `<tr><td colspan="10" style="text-align:center;padding:24px;color:#64748b;">No entries found.</td></tr>`;
          return;
        }
        tbody.innerHTML = rows.map(e => `
          <tr>
            <td>${e.entry_id}</td>
            <td>#${e.employee_id}</td>
            <td>${e.entry_date}</td>
            <td>${e.clock_in  ?? '—'}</td>
            <td>${e.clock_out ?? '—'}</td>
            <td>${e.regular_hours  ?? '—'}</td>
            <td>${e.overtime_hours ?? '—'}</td>
            <td><span class="type-badge">${e.entry_type ?? '—'}</span></td>
            <td>${e.approved
              ? '<span class="badge badge-approved">Approved</span>'
              : '<span class="badge badge-pending">Pending</span>'}
            </td>
            <td>
              ${!e.approved ? `<button class="action-btn" onclick="approveEntry(${e.entry_id})">Approve</button>` : ''}
              <button class="action-btn" onclick="deleteEntry(${e.entry_id})" style="margin-left:4px;color:#ef4444;">Delete</button>
            </td>
          </tr>`).join('');
      } catch (_) {
        document.getElementById('shiftsBody').innerHTML =
          `<tr><td colspan="10" style="text-align:center;padding:24px;color:#ef4444;">Failed to load entries.</td></tr>`;
      }
    }

    async function approveEntry(id) {
      const res = await fetch(`${API}/timeentries/${id}/approve`, {
        method: 'PATCH', headers,
        body: JSON.stringify({ approved: true })
      });
      if (res.ok) loadEntries();
    }

    async function deleteEntry(id) {
      if (!confirm('Delete this entry?')) return;
      const res = await fetch(`${API}/timeentries/${id}`, { method: 'DELETE', headers });
      if (res.ok) loadEntries();
    }

    document.getElementById('searchInput').addEventListener('input', loadEntries);
    document.getElementById('typeFilter').addEventListener('change', loadEntries);
    document.getElementById('approvedFilter').addEventListener('change', loadEntries);

    // ── Modal (shared) ───────────────────────────────────────────
    const overlay   = document.getElementById('entryOverlay');
    const formError = document.getElementById('formError');

    document.getElementById('addBtn').addEventListener('click', () => openAddModal());

    document.getElementById('cancelBtn').addEventListener('click', () => {
      overlay.classList.remove('open');
      ['fEmployeeId','fDate','fClockIn','fClockOut','fRegHours','fOtHours','fNotes']
        .forEach(id => { document.getElementById(id).value = ''; });
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      formError.style.display = 'none';
      const employeeId = parseInt(document.getElementById('fEmployeeId').value);
      const entryDate  = document.getElementById('fDate').value;
      if (!employeeId || !entryDate) {
        formError.textContent = 'Employee ID and Date are required.';
        formError.style.display = 'block';
        return;
      }
      const body = {
        employee_id:    employeeId,
        entry_date:     entryDate,
        clock_in:       document.getElementById('fClockIn').value  || null,
        clock_out:      document.getElementById('fClockOut').value || null,
        regular_hours:  parseFloat(document.getElementById('fRegHours').value) || null,
        overtime_hours: parseFloat(document.getElementById('fOtHours').value)  || null,
        entry_type:     document.getElementById('fType').value,
        notes:          document.getElementById('fNotes').value || null,
      };
      const res = await fetch(`${API}/timeentries/create`, {
        method: 'POST', headers, body: JSON.stringify(body)
      });
      if (res.ok) {
        const saved = await res.json();
        overlay.classList.remove('open');
        ['fEmployeeId','fDate','fClockIn','fClockOut','fRegHours','fOtHours','fNotes']
          .forEach(id => { document.getElementById(id).value = ''; });
        allEntries.push(saved);
        renderSchedule();
      } else {
        const err = await res.json().catch(() => ({}));
        formError.textContent = err.detail ?? 'Failed to save entry.';
        formError.style.display = 'block';
      }
    });

    // ── Init ─────────────────────────────────────────────────────
    loadScheduleData();
  </script>
</body>
</html>
