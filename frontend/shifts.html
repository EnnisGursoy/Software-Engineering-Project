<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shifts</title>
  <style>
    :root {
      --bg: #f6f9fc;
      --text: #1f2937;
      --surface: #ffffff;
      --border: #d1d5db;
      --accent: #0f766e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #1d4ed8;
      border-bottom: 1px solid #1e40af;
      position: relative;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
      color: #ffffff;
    }

    main {
      padding: 24px 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 780px;
    }

    .menu-wrap {
      position: relative;
    }

    .menu-btn {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 0;
    }

    .menu-btn span {
      width: 20px;
      height: 2px;
      background: #ffffff;
      border-radius: 10px;
      display: block;
    }

    .menu {
      position: absolute;
      right: 0;
      top: 50px;
      min-width: 210px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 8px;
      display: none;
      z-index: 20;
    }

    .menu.open {
      display: block;
    }

    .menu a {
      display: block;
      text-decoration: none;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .menu a:hover {
      background: #ecfeff;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <h1>Shifts</h1>

    <div class="menu-wrap">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="hrMenu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="menu" id="hrMenu" aria-hidden="true">
        <a href="profile.html">Profile</a>
        <a href="employees.html">Employees</a>
        <a href="shifts.html">Shifts</a>
        <a href="payroll.html">Payroll</a>
        <a href="taxes.html">Taxes</a>
        <a href="reports.html">Reports</a>
        <a href="settings.html">Settings</a>
      </nav>
    </div>
  </header>

  <main>
    <div id="errorBanner" style="background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;padding:10px 14px;border-radius:8px;margin-bottom:14px;display:none;"></div>

    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;">
      <select id="filterSelect" style="padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.9rem;">
        <option value="all">All Entries</option>
        <option value="pending">Pending Approval</option>
      </select>
      <input type="number" id="empFilterId" placeholder="Filter by Employee ID" style="padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.9rem;width:200px;">
      <button id="filterBtn" style="padding:8px 14px;background:#475569;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.9rem;">Filter</button>
      <button id="addEntryBtn" style="padding:8px 16px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:0.9rem;margin-left:auto;">+ Log Time</button>
    </div>

    <table style="width:100%;border-collapse:collapse;background:var(--surface);border-radius:10px;overflow:hidden;border:1px solid var(--border);">
      <thead>
        <tr style="background:#f1f5f9;">
          <th style="padding:10px 14px;text-align:left;font-size:0.9rem;">ID</th>
          <th style="padding:10px 14px;text-align:left;font-size:0.9rem;">Emp ID</th>
          <th style="padding:10px 14px;text-align:left;font-size:0.9rem;">Date</th>
          <th style="padding:10px 14px;text-align:left;font-size:0.9rem;">Clock In</th>
          <th style="padding:10px 14px;text-align:left;font-size:0.9rem;">Clock Out</th>
          <th style="padding:10px 14px;text-align:left;font-size:0.9rem;">Reg Hrs</th>
          <th style="padding:10px 14px;text-align:left;font-size:0.9rem;">OT Hrs</th>
          <th style="padding:10px 14px;text-align:left;font-size:0.9rem;">Type</th>
          <th style="padding:10px 14px;text-align:left;font-size:0.9rem;">Approved</th>
          <th style="padding:10px 14px;text-align:left;font-size:0.9rem;">Actions</th>
        </tr>
      </thead>
      <tbody id="entriesTable">
        <tr><td colspan="10" style="text-align:center;padding:20px;">Loading...</td></tr>
      </tbody>
    </table>
  </main>

  <!-- Log Time Modal -->
  <div id="entryModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;justify-content:center;align-items:center;">
    <div style="background:#fff;border-radius:12px;padding:28px;width:420px;max-width:96vw;max-height:90vh;overflow-y:auto;">
      <h2 style="margin:0 0 18px;font-size:1.1rem;">Log Time Entry</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <label style="display:flex;flex-direction:column;gap:4px;font-size:0.85rem;grid-column:1/-1;">Employee ID*<input type="number" id="e_emp_id" style="padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;"></label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:0.85rem;grid-column:1/-1;">Date*<input type="date" id="e_date" style="padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;"></label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:0.85rem;">Clock In<input type="time" id="e_clock_in" step="60" style="padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;"></label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:0.85rem;">Clock Out<input type="time" id="e_clock_out" step="60" style="padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;"></label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:0.85rem;">Regular Hours<input type="number" id="e_reg_hours" step="0.25" min="0" style="padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;"></label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:0.85rem;">Overtime Hours<input type="number" id="e_ot_hours" step="0.25" min="0" value="0" style="padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;"></label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:0.85rem;grid-column:1/-1;">Type
          <select id="e_type" style="padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;">
            <option value="work">Work</option>
            <option value="sick">Sick</option>
            <option value="vacation">Vacation</option>
            <option value="holiday">Holiday</option>
            <option value="unpaid">Unpaid</option>
          </select>
        </label>
        <label style="display:flex;flex-direction:column;gap:4px;font-size:0.85rem;grid-column:1/-1;">Notes<input type="text" id="e_notes" style="padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;"></label>
      </div>
      <div id="entryModalError" style="color:red;font-size:0.85rem;margin-top:10px;display:none;"></div>
      <div style="margin-top:18px;display:flex;gap:10px;justify-content:flex-end;">
        <button id="entryCancelBtn" style="padding:8px 16px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;">Cancel</button>
        <button id="entrySaveBtn" style="padding:8px 16px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;cursor:pointer;">Save</button>
      </div>
    </div>
  </div>

  <!-- Approve Modal -->
  <div id="approveModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;justify-content:center;align-items:center;">
    <div style="background:#fff;border-radius:12px;padding:28px;width:340px;max-width:96vw;">
      <h2 style="margin:0 0 18px;font-size:1.1rem;">Approve Time Entry</h2>
      <label style="display:flex;flex-direction:column;gap:4px;font-size:0.85rem;">Approver Employee ID*<input type="number" id="approver_id" style="padding:7px 9px;border:1px solid #d1d5db;border-radius:6px;"></label>
      <div id="approveError" style="color:red;font-size:0.85rem;margin-top:10px;display:none;"></div>
      <div style="margin-top:18px;display:flex;gap:10px;justify-content:flex-end;">
        <button id="approveCancelBtn" style="padding:8px 16px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer;">Cancel</button>
        <button id="approveConfirmBtn" style="padding:8px 16px;background:#16a34a;color:#fff;border:none;border-radius:6px;cursor:pointer;">Approve</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8000';

    function getToken() {
      const t = localStorage.getItem('token');
      if (!t) window.location.href = 'login.html';
      return t;
    }

    function authHeaders() {
      return { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' };
    }

    function showError(msg) {
      const b = document.getElementById('errorBanner');
      b.textContent = msg;
      b.style.display = 'block';
    }

    const menuBtn = document.getElementById('menuBtn');
    const hrMenu  = document.getElementById('hrMenu');
    menuBtn.addEventListener('click', () => {
      const isOpen = hrMenu.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', String(isOpen));
      hrMenu.setAttribute('aria-hidden', String(!isOpen));
    });
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.menu-wrap')) {
        hrMenu.classList.remove('open');
        menuBtn.setAttribute('aria-expanded', 'false');
        hrMenu.setAttribute('aria-hidden', 'true');
      }
    });

    let currentEntries = [];

    async function loadEntries(mode, empId) {
      try {
        let url;
        if (empId) {
          url = `${API_BASE}/timeentries/employee/${empId}`;
        } else if (mode === 'pending') {
          url = `${API_BASE}/timeentries/pending`;
        } else {
          url = `${API_BASE}/timeentries/all`;
        }
        const res = await fetch(url, { headers: authHeaders() });
        if (res.status === 401) { window.location.href = 'login.html'; return; }
        if (!res.ok) throw new Error('Failed to load time entries');
        currentEntries = await res.json();
        renderEntries(currentEntries);
      } catch (err) { showError(err.message); }
    }

    function renderEntries(entries) {
      const tbody = document.getElementById('entriesTable');
      if (!entries.length) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:20px;">No entries found.</td></tr>';
        return;
      }
      tbody.innerHTML = entries.map(e => `
        <tr>
          <td style="padding:9px 14px;font-size:0.88rem;border-bottom:1px solid #d1d5db;">${e.entry_id}</td>
          <td style="padding:9px 14px;font-size:0.88rem;border-bottom:1px solid #d1d5db;">${e.employee_id}</td>
          <td style="padding:9px 14px;font-size:0.88rem;border-bottom:1px solid #d1d5db;">${e.entry_date}</td>
          <td style="padding:9px 14px;font-size:0.88rem;border-bottom:1px solid #d1d5db;">${e.clock_in || '-'}</td>
          <td style="padding:9px 14px;font-size:0.88rem;border-bottom:1px solid #d1d5db;">${e.clock_out || '-'}</td>
          <td style="padding:9px 14px;font-size:0.88rem;border-bottom:1px solid #d1d5db;">${e.regular_hours ?? '-'}</td>
          <td style="padding:9px 14px;font-size:0.88rem;border-bottom:1px solid #d1d5db;">${e.overtime_hours ?? '-'}</td>
          <td style="padding:9px 14px;font-size:0.88rem;border-bottom:1px solid #d1d5db;">${e.entry_type || '-'}</td>
          <td style="padding:9px 14px;font-size:0.88rem;border-bottom:1px solid #d1d5db;color:${e.approved ? '#16a34a' : '#d97706'};font-weight:600;">${e.approved ? 'Yes' : 'Pending'}</td>
          <td style="padding:9px 14px;font-size:0.88rem;border-bottom:1px solid #d1d5db;">
            ${!e.approved ? `<button onclick="openApprove(${e.entry_id})" style="padding:3px 8px;font-size:0.8rem;background:#16a34a;color:#fff;border:none;border-radius:4px;cursor:pointer;margin-right:3px;">Approve</button>` : ''}
            ${!e.approved ? `<button onclick="deleteEntry(${e.entry_id})" style="padding:3px 8px;font-size:0.8rem;background:#dc2626;color:#fff;border:none;border-radius:4px;cursor:pointer;">Delete</button>` : ''}
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('filterBtn').addEventListener('click', () => {
      const mode = document.getElementById('filterSelect').value;
      const empId = document.getElementById('empFilterId').value.trim();
      loadEntries(mode, empId);
    });

    document.getElementById('addEntryBtn').addEventListener('click', () => {
      ['e_emp_id','e_date','e_clock_in','e_clock_out','e_reg_hours','e_notes'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('e_ot_hours').value = '0';
      document.getElementById('e_type').value = 'work';
      document.getElementById('entryModalError').style.display = 'none';
      document.getElementById('entryModal').style.display = 'flex';
    });

    document.getElementById('entryCancelBtn').addEventListener('click', () => {
      document.getElementById('entryModal').style.display = 'none';
    });

    document.getElementById('entrySaveBtn').addEventListener('click', async () => {
      const err = document.getElementById('entryModalError');
      err.style.display = 'none';
      const body = {
        employee_id:   parseInt(document.getElementById('e_emp_id').value),
        entry_date:    document.getElementById('e_date').value,
        clock_in:      document.getElementById('e_clock_in').value || null,
        clock_out:     document.getElementById('e_clock_out').value || null,
        regular_hours: document.getElementById('e_reg_hours').value ? parseFloat(document.getElementById('e_reg_hours').value) : null,
        overtime_hours: parseFloat(document.getElementById('e_ot_hours').value) || 0,
        entry_type:    document.getElementById('e_type').value,
        notes:         document.getElementById('e_notes').value.trim() || null,
      };
      try {
        const res = await fetch(`${API_BASE}/timeentries/create`, {
          method: 'POST', headers: authHeaders(), body: JSON.stringify(body),
        });
        if (!res.ok) {
          const e2 = await res.json();
          err.textContent = e2.detail || 'Save failed';
          err.style.display = 'block';
          return;
        }
        document.getElementById('entryModal').style.display = 'none';
        loadEntries('all', '');
      } catch (e2) {
        err.textContent = 'Server error';
        err.style.display = 'block';
      }
    });

    let approvingEntryId = null;

    function openApprove(entryId) {
      approvingEntryId = entryId;
      document.getElementById('approver_id').value = '';
      document.getElementById('approveError').style.display = 'none';
      document.getElementById('approveModal').style.display = 'flex';
    }

    document.getElementById('approveCancelBtn').addEventListener('click', () => {
      document.getElementById('approveModal').style.display = 'none';
    });

    document.getElementById('approveConfirmBtn').addEventListener('click', async () => {
      const approveError = document.getElementById('approveError');
      approveError.style.display = 'none';
      const approverId = parseInt(document.getElementById('approver_id').value);
      if (!approverId) {
        approveError.textContent = 'Approver ID required';
        approveError.style.display = 'block';
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/timeentries/${approvingEntryId}/approve`, {
          method: 'PATCH',
          headers: authHeaders(),
          body: JSON.stringify({ approved: true, approved_by: approverId }),
        });
        if (!res.ok) {
          const e2 = await res.json();
          approveError.textContent = e2.detail || 'Approval failed';
          approveError.style.display = 'block';
          return;
        }
        document.getElementById('approveModal').style.display = 'none';
        loadEntries('all', '');
      } catch (e2) {
        approveError.textContent = 'Server error';
        approveError.style.display = 'block';
      }
    });

    async function deleteEntry(entryId) {
      if (!confirm('Delete this time entry?')) return;
      try {
        const res = await fetch(`${API_BASE}/timeentries/${entryId}`, {
          method: 'DELETE', headers: authHeaders(),
        });
        if (!res.ok) {
          const e2 = await res.json();
          showError(e2.detail || 'Delete failed');
          return;
        }
        loadEntries('all', '');
      } catch (e2) { showError('Server error'); }
    }

    loadEntries('all', '');
  </script>
</body>
</html>
