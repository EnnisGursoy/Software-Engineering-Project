<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Home Page</title>
  <style>
    :root {
      --bg: #f6f9fc;
      --text: #1f2937;
      --surface: #ffffff;
      --border: #d1d5db;
      --accent: #0f766e;
      --accent-hover: #115e59;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    h1 {
      margin: 0;
      font-size: 1.3rem;
    }

    .menu-wrap {
      position: relative;
    }

    .menu-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 0;
    }

    .menu-btn span {
      width: 20px;
      height: 2px;
      background: var(--text);
      border-radius: 10px;
      display: block;
    }

    .menu {
      position: absolute;
      right: 0;
      top: 50px;
      min-width: 210px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 8px;
      display: none;
      z-index: 20;
    }

    .menu.open {
      display: block;
    }

    .menu a {
      display: block;
      text-decoration: none;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .menu a:hover {
      background: #ecfeff;
      color: var(--accent);
    }

    main {
      padding: 24px 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 780px;
    }

    .card p {
      margin: 0;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.1rem; }
      .menu { min-width: 180px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>HR Home Page</h1>

    <div class="menu-wrap">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="hrMenu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="menu" id="hrMenu" aria-hidden="true">
        <a href="profile.html">Profile</a>
        <a href="employees.html">Employees</a>
        <a href="shifts.html">Shifts</a>
        <a href="payroll.html">Payroll</a>
        <a href="taxes.html">Taxes</a>
        <a href="reports.html">Reports</a>
        <a href="settings.html">Settings</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="card">
      <p>Select an option from the top-right menu to manage HR tasks.</p>
    </section>
  </main>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const hrMenu = document.getElementById('hrMenu');

    menuBtn.addEventListener('click', () => {
      const isOpen = hrMenu.classList.toggle('open');
      menuBtn.setAttribute('aria-expanded', String(isOpen));
      hrMenu.setAttribute('aria-hidden', String(!isOpen));
    });

    document.addEventListener('click', (event) => {
      if (!event.target.closest('.menu-wrap')) {
        hrMenu.classList.remove('open');
        menuBtn.setAttribute('aria-expanded', 'false');
        hrMenu.setAttribute('aria-hidden', 'true');
      }
    });
  </script>
</body>
</html>
