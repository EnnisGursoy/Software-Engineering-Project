<!DOCTYPE html>
<html>
<head>
  <title>Pay Central - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="login" style="margin: 40px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh;">
    <h2 style="text-align: center;">Employee Login</h2>
    <form style="display: flex; flex-direction: column; align-items: center; width: 300px;">
      <input type="text" placeholder="User ID" required style="margin-bottom: 15px; width: 100%; padding: 8px;">
      <input type="password" placeholder="Password" required style="margin-bottom: 15px; width: 100%; padding: 8px;">
      <button type="submit" style="width: 100%; padding: 10px;">Login</button>
    </form>
  </section>
</body>
</html>
